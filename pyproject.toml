[project]
name = "treesize-navigator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.85",
]

[project.scripts]
treesize-navigator = "treesize_navigator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["treesize_navigator"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
